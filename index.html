
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SINCLINK - URL Shortener</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      width: 100%;
      max-width: 480px;
      padding: 30px;
      background: #151d32;
      border: 1px solid #293550;
      border-radius: 18px;
    }
    h1 { text-align: center; color: #65e5c0; }
    p { text-align: center; color: #aab5cc; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      background: #0b1020;
      color: white;
      border: 1px solid #35425e;
    }
    button {
      border: 0;
      background: #65e5c0;
      color: #07130f;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #0b1020;
      overflow-wrap: anywhere;
    }
    #message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>SINCLINK</h1>
  <p>Pendekkan link dengan mudah dan cepat.</p>

  <input id="urlInput" type="url"
    placeholder="Tempel URL panjang di sini">

  <button id="shortenBtn" onclick="shortenUrl()">
    SHORTEN LINK
  </button>

  <div id="message"></div>

  <div id="result">
    <p>Link pendek kamu:</p>
    <div id="shortUrl"></div>
    <button onclick="copyLink()">SALIN LINK</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://tnjelffyqzobrduzoaik.supabase.co";
const SUPABASE_KEY = "sb_publishable_2wVoUveP9gCAseJB8DLF-w_YcbdZFLp";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");

// Membuka link asli saat link pendek dikunjungi
async function checkRedirect() {
  const code = new URLSearchParams(location.search).get("s");
  if (!code) return;

  document.querySelector(".container").innerHTML =
    "<h1>SINCLINK</h1><p>Mengalihkan link...</p>";

  const { data, error } = await db
    .from("links")
    .select("original_url")
    .eq("short_code", code)
    .maybeSingle();

  if (error || !data) {
    document.querySelector(".container").innerHTML =
      "<h1>Link tidak ditemukan</h1><p>Link mungkin salah atau sudah tidak tersedia.</p>";
    return;
  }

  location.replace(data.original_url);
}

// Membuat link pendek
async function shortenUrl() {
  const input = document.getElementById("urlInput");
  const btn = document.getElementById("shortenBtn");
  const url = input.value.trim();

  document.getElementById("result").style.display = "none";

  let parsed;
  try {
    parsed = new URL(url);
    if (!["http:", "https:"].includes(parsed.protocol)) throw new Error();
  } catch {
    message.textContent = "Masukkan URL yang valid (http atau https).";
    return;
  }

  btn.disabled = true;
  btn.textContent = "MEMBUAT LINK...";
  message.textContent = "";

  try {
    let saved = false;
    let code = "";

    for (let i = 0; i < 5; i++) {
      code = Math.random().toString(36).substring(2, 9);

      const { error } = await db.from("links").insert({
        short_code: code,
        original_url: parsed.href
      });

      if (!error) {
        saved = true;
        break;
      }

      if (error.code !== "23505") {
        throw error;
      }
    }

    if (!saved) throw new Error("Gagal membuat kode unik.");

    const shortLink =
      location.origin + location.pathname + "?s=" + code;

    document.getElementById("shortUrl").textContent = shortLink;
    document.getElementById("result").style.display = "block";
    message.textContent = "Link berhasil dibuat!";
  } catch (error) {
    console.error(error);
    message.textContent = "Gagal membuat link. Periksa koneksi atau pengaturan Supabase.";
  } finally {
    btn.disabled = false;
    btn.textContent = "SHORTEN LINK";
  }
}

function copyLink() {
  const link = document.getElementById("shortUrl").textContent;
  navigator.clipboard.writeText(link)
    .then(() => message.textContent = "Link berhasil disalin!")
    .catch(() => message.textContent = "Gagal menyalin link.");
}

checkRedirect();
</script>

</body>
</html>
