

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SINCLINK - URL Shortener</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b1020;color:white;
 font-family:Arial,sans-serif;padding:25px 16px;
}
.container{max-width:550px;margin:auto}
header{text-align:center;padding:35px 0}
.logo{font-size:34px;font-weight:bold;color:#65a7ff}
header p{color:#aab4ca}
.card{
 background:#151e33;border:1px solid #293653;
 padding:22px;border-radius:17px;margin-bottom:20px;
}
h2{font-size:20px;margin-top:0}
input{
 width:100%;padding:15px;border-radius:9px;
 border:1px solid #394967;background:#0b1428;
 color:white;font-size:15px;margin:12px 0;
}
button{
 width:100%;padding:15px;border:0;
 border-radius:9px;background:#347df2;
 color:white;font-weight:bold;font-size:15px;
}
button:active{opacity:.8}
.result{margin-top:15px;overflow-wrap:anywhere}
small{color:#aab4ca}
footer{text-align:center;color:#8290a9;margin:30px}
</style>
</head>
<body>
<div class="container">
<header>
 <div class="logo">🔗 SINCLINK</div>
 <p>One Link. Endless Possibilities.</p>
</header>

<div class="card">
 <h2>🔗 Shorten Your Link</h2>
 <small>Masukkan URL panjang yang ingin dipendekkan.</small>
 <input id="longUrl" type="url"
 placeholder="https://contoh.com/link-panjang">
 <button onclick="shorten()">SHORTEN LINK</button>
 <div class="result" id="linkResult"></div>
</div>

<div class="card">
 <h2>📁 Upload Your File</h2>
 <small>Pilih file yang ingin dibagikan.</small>
 <input type="file" id="fileInput">
 <div id="fileInfo"></div>
 <button onclick="uploadInfo()">PILIH FILE</button>
</div>

<footer>
SINCLINK © 2026<br>
<small>Simple Link Sharing Platform</small>
</footer>
</div>

<script>
function shorten(){
 const input=document.getElementById('longUrl');
 const result=document.getElementById('linkResult');
 try{
  const url=new URL(input.value);
  if(!['http:','https:'].includes(url.protocol)) throw 0;
  result.innerHTML='<small>URL valid! Backend shortener akan disambungkan pada tahap berikutnya.</small>';
 }catch(e){
  result.innerHTML='<small>Masukkan URL yang valid.</small>';
 }
}
function uploadInfo(){
 const file=document.getElementById('fileInput').files[0];
 const info=document.getElementById('fileInfo');
 if(!file){
  info.innerHTML='<small>Pilih file terlebih dahulu.</small>';
  return;
 }
 info.innerHTML='<p>'+file.name+'</p><small>Ukuran: '+(file.size/1024/1024).toFixed(2)+' MB. Penyimpanan akan disambungkan pada tahap berikutnya.</small>';
}
</script>
</body>
</html>
